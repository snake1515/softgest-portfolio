<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WillAires · Entrando</title>
  <meta name="description" content="Entrada a la app de WillAires, reparación de aires acondicionados.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/willaires-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --cafe:#f26a1b; --cafe-osc:#1450b4; --fondo:#0a1a3f; --crema:#eaf1fb; --texto:#dbe5f5; --suave:#9fb2d0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--texto);
      background: radial-gradient(900px 500px at 15% 0%, #16357a 0%, transparent 60%), radial-gradient(700px 400px at 100% 100%, #3a1f1a 0%, transparent 60%), var(--fondo);
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .caja { width: 100%; max-width: 420px; text-align: center; }
    .logo { width: 300px; max-width: 86%; height: auto; padding: 14px 18px; background: #fff; border-radius: 22px; box-shadow: 0 10px 34px rgba(0,0,0,.45); }
    h1 { font-size: 30px; margin: 18px 0 4px; color: #fff; letter-spacing: -.01em; }
    .sub { color: var(--suave); margin: 0 0 30px; font-size: 15px; }
    .barra { height: 8px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
    .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2f7fd6, #f26a1b);
      border-radius: 99px; transition: width .6s ease; }
    .estado { margin: 14px 0 0; font-size: 15px; font-weight: 500; color: #fff; min-height: 22px; }
    .tip { margin: 26px auto 0; padding: 14px 16px; background: rgba(255,255,255,.06); border-radius: 12px;
      font-size: 14px; line-height: 1.45; color: var(--texto); min-height: 70px; transition: opacity .4s; }
    .tip b { color: #ff9a5c; display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .btn { display: none; margin: 22px auto 0; background: #c2410c; color: #fff; text-decoration: none; font-weight: 700;
      padding: 12px 22px; border-radius: 99px; font-size: 15px; }
    .pie { margin-top: 34px; font-size: 13px; color: var(--suave); }
    .pie a { color: var(--suave); }
    @media (prefers-reduced-motion: reduce) { .barra i, .tip { transition: none; } }
  </style>
</head>
<body>
  <main class="caja">
    <img class="logo" src="../assets/willaires-logo.png" alt="WillAires">
    <h1>WillAires</h1>
    <p class="sub">Preparando tu app…</p>
    <div class="barra" aria-hidden="true"><i id="barra"></i></div>
    <p class="estado" id="estado" role="status">Conectando con el servidor</p>
    <div class="tip" id="tip"></div>
    <a class="btn" id="btn" href="#">Entrar a la app →</a>
    <div class="pie">por <a href="../">SoftGest</a></div>
  </main>
  <script>
    // Dirección de la app en Render. Si cambia el dominio, solo hay que cambiar esta línea.
    const APP = 'https://ventisca-app.onrender.com';
    const DESTINO = APP + '/login';
    const TIPS = [
      'Al entrar, la app te muestra qué clientes tienen el mantenimiento vencido o por vencer.',
      'Con un clic le mandas al cliente el recordatorio de mantenimiento por WhatsApp.',
      'Al terminar una orden, el próximo preventivo de cada equipo se calcula solo.',
      'Si un equipo vuelve a fallar dentro de la garantía, la app te avisa para no cobrar la visita.',
      'Convierte una cotización aprobada en orden de servicio con un clic.',
      'Cada técnico ve su agenda en el celular y cierra la orden desde allá.',
      'En Venta de equipos ves cuánto te ganaste en cada aire que vendiste.',
    ];
    const $ = id => document.getElementById(id);
    let i = 0;
    const tip = () => { $('tip').style.opacity = 0; setTimeout(() => {
      $('tip').innerHTML = '<b>¿Sabías que?</b>' + TIPS[i++ % TIPS.length]; $('tip').style.opacity = 1; }, 300); };
    tip(); const tTip = setInterval(tip, 6000);

    const inicio = Date.now();
    let avance = 4;
    const tBarra = setInterval(() => { avance = Math.min(avance + (92 - avance) * 0.06, 92); $('barra').style.width = avance + '%'; }, 500);
    const mensajes = [[0, 'Conectando con el servidor'], [6, 'Encendiendo la app'], [20, 'Ya casi está lista'],
                      [45, 'Está tardando un poco más de lo normal'], [75, 'Seguimos intentando…']];
    const tMsg = setInterval(() => { const s = (Date.now() - inicio) / 1000;
      $('estado').textContent = mensajes.filter(m => s >= m[0]).pop()[1];
      if (s > 25) { $('btn').style.display = 'inline-block'; } }, 1000);
    $('btn').href = DESTINO;

    async function listo() {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 10000);
      try {
        const r = await fetch(APP + '/salud?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
        const j = await r.json();
        return j && j.ok === true;
      } catch (e) { return false; } finally { clearTimeout(t); }
    }
    async function esperar() {
      while ((Date.now() - inicio) < 150000) {
        if (await listo()) {
          clearInterval(tBarra); clearInterval(tMsg); clearInterval(tTip);
          $('barra').style.width = '100%'; $('estado').textContent = '¡Lista! Entrando…';
          setTimeout(() => location.replace(DESTINO), 500);
          return;
        }
        await new Promise(r => setTimeout(r, 2500));
      }
      $('estado').textContent = 'No pudimos confirmar que la app esté lista. Intenta entrar.';
      $('btn').style.display = 'inline-block';
    }
    esperar();
  </script>
</body>
</html>
